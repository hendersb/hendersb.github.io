<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unorthodox RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="title.jpg" alt="Unorthodox" class="banner">
  <nav>
    <button id="tab-create" class="tab active">Character Sheet</button>
    <button id="tab-roll" class="tab">Roller</button>
    <button id="tab-journal" class="tab">Journal</button>
    <div id="music" class="music" hidden>
      <button id="m-prev" title="Previous track">⏮</button>
      <button id="m-play" title="Play music">▶</button>
      <button id="m-next" title="Next track">⏭</button>
      <span id="m-title" class="m-title">Music</span>
      <input id="m-vol" type="range" min="0" max="100" value="50" title="Music volume">
    </div>
  </nav>
</header>
<main>
  <section id="page-create"></section>
  <section id="page-roll" hidden></section>
  <section id="page-journal" hidden></section>
</main>
<div id="toast" hidden></div>
<script src="rules.js"></script>
<script src="help.js"></script>
<script src="app.js"></script>
<script src="tracks.js"></script>
<script src="music.js"></script>
</body>
</html>
